
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-maintenance
  labels:
    app: industrial-maintenance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industrial-maintenance
  template:
    metadata:
      labels:
        app: industrial-maintenance
    spec:
      containers:
        - name: industrial-maintenance
          image: harshid2007/industrial-maintenance:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-maintenance-service
spec:
  type: NodePort
  selector:
    app: industrial-maintenance
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
 
 